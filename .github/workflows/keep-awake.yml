# Render's free plan sleeps after 15 idle minutes. Ping the site so judges never wait.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ProofPay
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.PROOFPAY_URL || 'https://proofpay.onrender.com' }}/api/health"
